name: Actualizar datos campeonato

# ================================================================
# ÚNICA FUENTE DE VERDAD — edita solo estas dos líneas:
env:
  CAMPEONATO_ID: "111"
  CAMPEONATO_CLUB: "CHI"   # siglas del club (icon_sigla en la web)
# ================================================================

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:          # también se puede lanzar a mano desde GitHub

# Evita que dos ejecuciones se pisen al hacer push
concurrency:
  group: fetch-campeonato
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Descargar datos de la federación
        run: |
          mkdir -p data
          curl -sS --fail \
            --max-time 30 \
            --user-agent "Mozilla/5.0 (compatible; ClubChiralt-bot)" \
            "https://federacion.tkdcv.es/federacion/app/nosession.php?permiso=campeonato&operacion=contiendas&id=${CAMPEONATO_ID}" \
            -o data/campeonato.html

      - name: Guardar configuración para la web
        run: |
          printf '{"id":"%s","clubSigla":"%s"}\n' "${CAMPEONATO_ID}" "${CAMPEONATO_CLUB}" > data/config.json

      - name: Confirmar y publicar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/campeonato.html data/config.json

          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi

          git commit -m "Actualizar datos campeonato [skip ci]"

          # Reintenta por si el repo cambió mientras corría el workflow
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Intento $i fallido, reintentando..."
            sleep 5
          done
          echo "No se pudo hacer push tras 3 intentos."
          exit 1
