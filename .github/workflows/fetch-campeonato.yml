name: Actualizar datos campeonato

on:
  schedule:
    # Cada 5 minutos (GitHub lo ejecuta aprox. cada 5 min en días activos)
    - cron: '*/5 * * * *'
  workflow_dispatch:   # también se puede lanzar a mano desde la interfaz de GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para hacer git push al repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Descargar datos de la federación
        run: |
          curl -s \
            --max-time 30 \
            --user-agent "Mozilla/5.0 (compatible; ClubChiralt-bot)" \
            "https://federacion.tkdcv.es/federacion/app/nosession.php?permiso=campeonato&operacion=contiendas&id=41" \
            -o data/campeonato.html

      - name: Confirmar y publicar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/campeonato.html
          # Solo hace commit si el archivo cambió
          git diff --cached --quiet || git commit -m "Actualizar datos campeonato [skip ci]"
          git push
